name: Rust

on:
  push:
    branches: [main]
    paths: ["**/*.rs", "**/Cargo.toml", "**/Cargo.lock", ".github/**/*.yml", ".gitmodules", "postcard-bindgen/vendor/postcard-c"]
  pull_request:
    branches: [main]
    paths: ["**/*.rs", "**/Cargo.toml", "**/Cargo.lock", ".github/**/*.yml", ".gitmodules", "postcard-bindgen/vendor/postcard-c"]

jobs:        

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check
      - run: cargo fmt --manifest-path examples/single_crate/Cargo.toml -- --check

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: typos-action      
        uses: crate-ci/typos@v1.49.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - run: cargo hack check --feature-powerset

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - run: cargo hack clippy --feature-powerset -- --deny warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - run: cargo test --all-features
      - run: cargo check --manifest-path examples/single_crate/Cargo.toml --no-default-features
      - run: cargo test --manifest-path examples/single_crate/Cargo.toml --all-features

